[project]
name = "option-pricer"
version = "0.1.0"
description = "Quantitative Python project scaffold (src layout + Poetry)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "Proprietary" }

dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.12,<2.0",
  "matplotlib>=3.8,<4.0",
  "quantlib>=1.41,<2.0",
  "pydantic>=2,<3",
  "numba (>=0.64.0,<0.65.0)",
  "line-profiler (>=5.0.2,<6.0.0)",
  "memory-profiler (>=0.61.0,<0.62.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "coverage>=7,<8",
  "black>=26,<27",
  "pre-commit>=4,<5"
]
lint = [
  "ruff>=0.4,<1.0",
  "mypy>=1.10,<2.0"
]
types = [
  "scipy-stubs>=1.12,<2.0",
  "pandas-stubs>=2.2,<3.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--junitxml=report.xml"
]
filterwarnings = ["ignore::DeprecationWarning"]
