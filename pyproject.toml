[project]
name = "option-pricer"
version = "0.1.0"
description = "Monte Carlo pricer for European and American exotic options under the Heston and Bates models"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Oscar Bonnet" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "option pricing",
  "monte carlo",
  "heston",
  "bates",
  "stochastic volatility",
  "jump diffusion",
  "longstaff-schwartz",
  "exotic options",
  "quantitative finance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
  "numpy>=1.26,<3.0",
  "matplotlib>=3.8,<4.0",
  "quantlib>=1.41,<2.0",
  "pydantic>=2,<3",
  "numba>=0.64,<0.65"
]

[project.urls]
Repository = "https://github.com/oscar12351235/option-pricer"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "coverage>=7,<8",
  "black>=26,<27",
  "pre-commit>=4,<5"
]
lint = [
  "ruff>=0.4,<1.0",
  "mypy>=1.10,<2.0"
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["option_pricer", "config", "run"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "run.py", "config"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = [
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--junitxml=report.xml"
]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: Monte Carlo benchmarks with large path counts (deselect with -m 'not slow')"]

[tool.coverage.report]
fail_under = 80
